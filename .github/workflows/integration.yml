name: Linux integration

on:
  push:
    branches: [main, dev, debug]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-host-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            -r requirements-dev.lock
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables iptables
      - name: Run unit suite on Linux
        run: python -m pytest -q
      - name: Verify managed-node recovery, billing and profile contracts
        # Unit/loopback proof only, not real SSH or VPS cascade evidence.
        run: >-
          python -m pytest -q
          tests/test_managed_node_protocol_configuration.py
          tests/test_managed_node_sync.py
          tests/test_managed_node_accounting.py
          tests/test_managed_node_profiles.py
          tests/test_managed_node_subscriptions.py
          tests/test_managed_node_protocol_fields.py
          tests/test_node_sync.py
      - name: Exercise root, systemd, nftables and backup lifecycle
        run: >-
          sudo --preserve-env=PATH
          bash .github/scripts/linux-integration-smoke.sh
      - name: Exercise transactional main-to-dev upgrade
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: >-
          sudo --preserve-env=PATH,GITHUB_WORKSPACE
          bash .github/scripts/linux-upgrade-smoke.sh
